spring.application.name=venue-service
server.port=${SERVER_PORT}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

gateway.internal-secret=${JWT_SECRET}

auth.service.url=${AUTH_SERVICE_URL}

cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT}
cloudflare.r2.public-domain=${CLOUDFLARE_R2_PUBLIC_DOMAIN}
cloudflare.r2.expiration-minutes=${CLOUDFLARE_R2_EXPIRATION_MINUTES}
cloudflare.r2.bucket=${CLOUDFLARE_R2_BUCKET}

management.endpoints.web.exposure.include=health,prometheus,info
management.prometheus.metrics.export.enabled=true