# APPLICATION
spring.application.name=GOATSPORTS-VENUE-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# SQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# SERVICES
storage.service.url=${STORAGE_SERVICE_URL}
payment.service.url=${PAYMENT_SERVICE_URL}
notification.service.url=${NOTIFICATION_SERVICE_URL}
ai.service.url=${AI_SERVICE_URL}
# GEOCODING
geocoding.nominatim.base-url=${NOMINATIM_BASE_URL}
geocoding.nominatim.user-agent=${NOMINATIM_USER_AGENT}
geocoding.cache.ttl=${GEOCODING_CACHE_TTL}
geocoding.cache.max-entries=${GEOCODING_CACHE_MAX_ENTRIES}
# VIETMAP
vietmap.api.base-url=${VIETMAP_API_BASE_URL}
vietmap.api.key=${VIETMAP_API_KEY}
vietmap.cache.ttl=${VIETMAP_CACHE_TTL}
vietmap.cache.max-entries=${VIETMAP_CACHE_MAX_ENTRIES}
# FEIGN
spring.cloud.openfeign.client.config.GOATSPORTS-AI-SERVICE.connectTimeout=${AI_SERVICE_CONNECT_TIMEOUT_MS}
spring.cloud.openfeign.client.config.GOATSPORTS-AI-SERVICE.readTimeout=${AI_SERVICE_READ_TIMEOUT_MS}
owner-application.background-retry-ms=${OWNER_APPLICATION_BACKGROUND_RETRY_MS}
# JWT
app.jwt.secret=${JWT_SECRET}
app.gateway.secret=${GATEWAY_SECRET}
app.check-in.qr-secret=${CHECK_IN_QR_SECRET}
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.topic.user-log=${KAFKA_TOPIC_USER_LOG}
payment.events.consumer-enabled=${PAYMENT_EVENTS_CONSUMER_ENABLED}
payment.events.topic=${PAYMENT_EVENTS_TOPIC}
payment.events.venue-group-id=${PAYMENT_EVENTS_VENUE_GROUP_ID}
file.events.move-completed-topic=${FILE_MOVE_COMPLETED_TOPIC}
file.events.venue-group-id=${FILE_MOVE_COMPLETED_VENUE_GROUP_ID}
# BOOKING
booking.payment-hold-duration=${BOOKING_PAYMENT_HOLD_DURATION}
booking.payment-hold-expiration-enabled=${BOOKING_PAYMENT_HOLD_EXPIRATION_ENABLED}
booking.payment-hold-expiration-scan-ms=${BOOKING_PAYMENT_HOLD_EXPIRATION_SCAN_MS}
booking.cancellation-auto-approval-window=${BOOKING_CANCELLATION_AUTO_APPROVAL_WINDOW:PT1H}
booking.online-check-in-early-window=${ONLINE_CHECK_IN_EARLY_WINDOW}
booking.auto-completion-enabled=${BOOKING_AUTO_COMPLETION_ENABLED}
booking.auto-completion-scan-ms=${BOOKING_AUTO_COMPLETION_SCAN_MS}
booking.auto-completion-batch-size=${BOOKING_AUTO_COMPLETION_BATCH_SIZE}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# SWAGGER
springdoc.api-docs.enabled=false
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=false
# PAGINATION
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.max-page-size=20
# FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.enabled=true
server.tomcat.max-part-count=${MAX_PART_COUNT}
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh