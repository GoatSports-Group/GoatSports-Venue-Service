server.port=0

spring.datasource.url=jdbc:h2:mem:venue_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ponytail: schema sinh tu entity thay vi chay Liquibase. Changelog co
# "UPDATE ... FROM" cua PostgreSQL (backfill khi bo VenueOwnerProfile) ma H2 khong
# parse duoc. Test nay kiem bean wiring + JPA mapping, khong kiem migration --
# migration van chay that tren Postgres o dev/prod. Doi sang Testcontainers neu
# can kiem ca migration trong CI.
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false

eureka.client.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

storage.service.url=http://localhost:7075
payment.service.url=http://localhost:7078
notification.service.url=http://localhost:7073
ai.service.url=http://localhost:7081

geocoding.nominatim.base-url=http://localhost:8090
geocoding.nominatim.user-agent=goatsports-test
geocoding.cache.ttl=PT1H
geocoding.cache.max-entries=100
vietmap.api.base-url=http://localhost:9999
vietmap.api.key=test-key
vietmap.cache.ttl=PT1H
vietmap.cache.max-entries=100

spring.cloud.openfeign.client.config.GOATSPORTS-AI-SERVICE.connectTimeout=1000
spring.cloud.openfeign.client.config.GOATSPORTS-AI-SERVICE.readTimeout=1000
owner-application.background-retry-ms=60000

app.jwt.secret=test-jwt-secret-value-for-venue-service-tests
app.gateway.secret=test-gateway-secret
app.check-in.qr-secret=test-check-in-qr-secret

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.topic.user-log=user-log-topic-test
payment.events.consumer-enabled=false
payment.events.topic=payment-events-topic-test
payment.events.venue-group-id=venue-test-group
file.events.move-completed-topic=file-move-completed-test
file.events.venue-group-id=venue-file-test-group

booking.payment-hold-duration=PT15M
booking.payment-hold-expiration-enabled=false
booking.payment-hold-expiration-scan-ms=60000
booking.cancellation-auto-approval-window=PT24H
booking.online-check-in-early-window=PT30M
booking.auto-completion-enabled=false
booking.auto-completion-scan-ms=60000
booking.auto-completion-batch-size=50

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.root=WARN
logging.level.iuh.fit.venueservice=INFO

server.tomcat.max-part-count=100
venue.semantic-search.enabled=false
venue.search.cache.ttl-seconds=60
venue.search.cache.max-entries=1000
